[package]
name = "chilldb"
version = "0.1.0"
description = "A chill SQL client for MySQL/MariaDB and PostgreSQL"
authors = ["ChillDB"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chilldb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "mysql",
  "chrono",
  "bigdecimal",
  "json",
  "uuid",
] }
ssh2 = "0.9"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["time", "sync"] }
